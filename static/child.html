<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منارة - منارة</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            background: radial-gradient(ellipse at 20% 50%, #0d1b4b 0%, #050a1a 60%, #000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
            gap: 20px;
        }

        .stars { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle var(--d, 3s) ease-in-out infinite alternate; opacity: var(--o, 0.7); }
        @keyframes twinkle { from { opacity: var(--o, 0.7); transform: scale(1); } to { opacity: 0.2; transform: scale(0.5); } }

        .planet { position: absolute; border-radius: 50%; opacity: 0.5; filter: blur(1px); }

        .top-bar {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            flex-shrink: 0;
        }

        .top-logo { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 0 20px #a78bfa; }
        
        .nav-controls { display: flex; gap: 10px; }

        .back-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.8);
            border-radius: 12px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: 0.3s;
        }

        .end-btn {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            border-radius: 12px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 900;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: 0.3s;
        }

        .end-btn:hover { background: #ef4444; color: #fff; transform: scale(1.05); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }

        .agent-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            width: 100%;
            margin-top: 20px;
            flex-shrink: 0;
        }

        .circle-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }

        .wave { position: absolute; border-radius: 50%; border: 2px solid rgba(124, 58, 237, 0.3); animation: wave-idle 3s ease-in-out infinite; }
        .wave:nth-child(1) { width: 220px; height: 220px; animation-delay: 0s; }
        .wave:nth-child(2) { width: 180px; height: 180px; animation-delay: 0.4s; }
        .wave:nth-child(3) { width: 140px; height: 140px; animation-delay: 0.8s; }

        @keyframes wave-idle { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.08); opacity: 0.15; } }

        .wave.speaking { border-color: rgba(167, 139, 250, 0.8); animation: wave-speak 0.6s ease-in-out infinite; }
        @keyframes wave-speak { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.15); opacity: 0.3; } }

        .wave.listening { border-color: rgba(52, 211, 153, 0.8); animation: wave-listen 0.4s ease-in-out infinite; }
        @keyframes wave-listen { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.2); opacity: 0.4; } }

        .agent-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #5b21b6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: 0 15px 50px rgba(124,58,237,0.7);
        }

        .agent-name { font-size: 30px; font-weight: 900; color: #fff; text-shadow: 0 0 25px #a78bfa; margin-bottom: 5px; }
        .agent-sub { font-size: 16px; color: rgba(255,255,255,0.6); margin-bottom: 35px; letter-spacing: 1px; }

        .speech-bubble {
            background: rgba(124,58,237,0.15);
            border: 1px solid rgba(167,139,250,0.3);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 18px 25px;
            max-width: 400px;
            text-align: center;
            color: #ddd6fe;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
            min-height: 60px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .mic-btn {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #7c3aed, #5b21b6);
            color: white;
            font-size: 36px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 12px 35px rgba(124,58,237,0.7);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-btn:hover { transform: scale(1.1) translateY(-5px); }

        .mic-btn.recording {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            box-shadow: 0 0 40px rgba(239,68,68,0.8);
            animation: pulse-mic 1.2s infinite;
        }

        @keyframes pulse-mic { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

        .mic-status { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.5); margin-bottom: 25px; }

        .chat-box {
            width: 100%;
            max-width: 500px;
            height: 220px;
            min-height: 220px;
            max-height: 220px;
            overflow-y: auto;
            overflow-x: hidden;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 15px;
            z-index: 10;
            backdrop-filter: blur(5px);
            scroll-behavior: smooth;
            overscroll-behavior: contain;
            flex-shrink: 0;
            margin-bottom: 30px;
        }

        .chat-msg { margin-bottom: 12px; animation: slideIn 0.4s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg-bubble {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 15px;
            font-size: 14px;
            max-width: 85%;
            word-wrap: break-word;
            line-height: 1.8;
        }

        .child-msg { color: #fff; margin-bottom: 8px; text-align: right; }
        .child-msg span { background: rgba(255,255,255,0.1); border-radius: 15px 15px 0 15px; }

        .ai-msg { color: #c4b5fd; text-align: left; }
        .ai-msg span { background: rgba(124,58,237,0.25); border-radius: 15px 15px 15px 0; border: 1px solid rgba(167,139,250,0.2); }

        .chat-empty { text-align: center; color: rgba(255,255,255,0.2); font-size: 14px; padding-top: 70px; }

        .chat-box::-webkit-scrollbar { width: 8px; }
        .chat-box::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
        .chat-box::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(124,58,237,0.9), rgba(167,139,250,0.8));
            border-radius: 10px;
        }
        .chat-box::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, rgba(139,92,246,1), rgba(196,181,253,1));
        }
    </style>
</head>
<body>

    <div class="stars" id="stars"></div>
    <div class="planet" style="width:150px;height:150px;background:radial-gradient(circle at 30% 30%,#6366f1,#1e1b4b);top:-40px;right:-40px;"></div>
    <div class="planet" style="width:90px;height:90px;background:radial-gradient(circle at 30% 30%,#10b981,#064e3b);bottom:40px;left:-20px;"></div>

    <div class="top-bar">
        <div class="top-logo">🌟 منارة</div>
        <div class="nav-controls">
            <button class="back-btn" onclick="window.location.href='/'">← رجوع</button>
            <button class="end-btn" onclick="endSession()">إنهاء الجلسة 🚪</button>
        </div>
    </div>

    <div class="agent-area">
        <div class="circle-wrapper">
            <div class="wave" id="wave1"></div>
            <div class="wave" id="wave2"></div>
            <div class="wave" id="wave3"></div>
            <div class="agent-circle">
                <svg width="85" height="85" viewBox="0 0 140 140">
                    <defs>
                        <radialGradient id="grad1" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#ede9fe;stop-opacity:1" />
                        </radialGradient>
                    </defs>
                    <circle cx="70" cy="55" r="32" fill="url(#grad1)" />
                    <ellipse id="pupilL" cx="58" cy="52" rx="3.5" ry="3.5" fill="#4c1d95" />
                    <ellipse id="pupilR" cx="82" cy="52" rx="3.5" ry="3.5" fill="#4c1d95" />
                    <path id="mouth" d="M60 68 Q70 78 80 68" stroke="#4c1d95" stroke-width="3" fill="none" stroke-linecap="round" />
                </svg>
            </div>
        </div>

        <div class="agent-name" id="agentGreeting">منار 💜</div>
        <div class="agent-sub" id="statusText">صديقتك الذكية جاهزة</div>

        <div class="speech-bubble" id="speechBubble">
            أهلاً بك يا بطل! أنا صديقتك منار، اضغط على الميكروفون وتحدث معي عن أي شيء يدور في بالك.
        </div>

        <button class="mic-btn" id="micBtn" onclick="toggleRecording()">🎤</button>
        <div class="mic-status" id="micStatus">اضغط على الميكروفون للبدء</div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="chat-empty" id="chatEmpty">محادثتنا الجميلة ستظهر هنا 💬</div>
    </div>

    <script>
        const starsEl = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            const size = Math.random() * 2 + 0.5;
            s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*5}s;--o:${0.3+Math.random()*0.7};animation-delay:${Math.random()*5}s;`;
            starsEl.appendChild(s);
        }

        setInterval(() => {
            const pl = document.getElementById('pupilL');
            const pr = document.getElementById('pupilR');
            if (pl && pr) {
                pl.setAttribute('ry', '0.5'); pr.setAttribute('ry', '0.5');
                setTimeout(() => { pl.setAttribute('ry', '3.5'); pr.setAttribute('ry', '3.5'); }, 200);
            }
        }, 5000);

        const urlParams = new URLSearchParams(window.location.search);
        const childId = urlParams.get('child_id') || 1;
        const childToken = urlParams.get('token') || '';

        async function loadChildData() {
            try {
                const res = await fetch(`/public/child_info/${encodeURIComponent(childId)}?token=${encodeURIComponent(childToken)}`);
                const data = await res.json();
                if (data.found && data.name) {
                    document.getElementById('agentGreeting').textContent = `أهلاً ${data.name}! 👋`;
                    document.getElementById('speechBubble').textContent = `أهلاً يا ${data.name}! أنا منار، كيف كان يومك؟ تكلم معي 🎙️`;
                }
            } catch (err) { console.error("Error loading child data"); }
        }
        loadChildData();

        function setVisualState(state) {
            const waves = document.querySelectorAll('.wave');
            waves.forEach(w => {
                w.className = 'wave';
                if (state === 'speaking') w.classList.add('speaking');
                if (state === 'listening') w.classList.add('listening');
            });
        }

        function updateChat(userTxt, aiTxt) {
            const chatBox = document.getElementById('chatBox');
            document.getElementById('chatEmpty')?.remove();

            const div = document.createElement('div');
            div.className = 'chat-msg';

            div.innerHTML = `
                <div class="child-msg"><span class="msg-bubble">🧒 ${userTxt}</span></div>
                <div class="ai-msg"><span class="msg-bubble">💜 ${aiTxt}</span></div>
            `;

            chatBox.appendChild(div);

            chatBox.scrollTo({
                top: chatBox.scrollHeight,
                behavior: 'smooth'
            });
        }

        let mediaRecorder, audioChunks = [], isRecording = false;

        async function toggleRecording() {
            if (!isRecording) await startMic();
            else stopMic();
        }

        async function startMic() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = processRecording;
                
                mediaRecorder.start();
                isRecording = true;
                document.getElementById('micBtn').classList.add('recording');
                document.getElementById('micBtn').textContent = '⏹️';
                document.getElementById('micStatus').textContent = '🔴 أنا أسمعك الآن... تكلم';
                setVisualState('listening');
            } catch (err) {
                alert("يرجى السماح بالوصول للميكروفون");
            }
        }

        function stopMic() {
            mediaRecorder.stop();
            isRecording = false;
            document.getElementById('micBtn').classList.remove('recording');
            document.getElementById('micBtn').textContent = '🎤';
            document.getElementById('micStatus').textContent = '⏳ منار تفكر في رد جميل...';
            document.getElementById('speechBubble').textContent = '⏳ لحظة واحدة...';
            setVisualState('idle');
        }

        async function processRecording() {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const formData = new FormData();
            formData.append('audio', blob, 'child_voice.webm');
            formData.append('child_id', childId);
            formData.append('token', childToken);

            try {
                const res = await fetch('/ask', { method: 'POST', body: formData });
                const data = await res.json();
                
                if (data.error) throw new Error(data.error);

                document.getElementById('speechBubble').textContent = data.response_text;
                document.getElementById('micStatus').textContent = 'اضغط للتحدث مرة أخرى';
                updateChat(data.user_text, data.response_text);

                if (data.audio_url) {
                    setVisualState('speaking');
                    const audio = new Audio(data.audio_url + '?v=' + Date.now());
                    audio.play();
                    audio.onended = () => setVisualState('idle');
                }
            } catch (err) {
                document.getElementById('micStatus').textContent = 'حدث خطأ بسيط، جرب ثانية';
                document.getElementById('speechBubble').textContent = 'عذراً يا بطل، واجهت مشكلة في الاتصال 😔';
            }
        }

        async function endSession() {
            if (confirm("هل انتهيت من محادثتنا اليوم؟ سيتم حفظ تقدمك 🌟")) {
                try {
                    const res = await fetch(`/end_session/${childId}?token=${encodeURIComponent(childToken)}`, { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        alert("تم حفظ الجلسة بنجاح! نراك قريباً ❤️");
                        window.location.href = '/';
                    }
                } catch (err) {
                    window.location.href = '/';
                }
            }
        }
    </script>
</body>
</html>
