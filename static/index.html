<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منارة</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            background: radial-gradient(ellipse at 20% 50%, #0d1b4b 0%, #050a1a 60%, #000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .stars {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
            opacity: var(--o, 0.7);
        }
        @keyframes twinkle {
            from { opacity: var(--o, 0.7); transform: scale(1); }
            to { opacity: 0.2; transform: scale(0.5); }
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            opacity: 0.5;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        .logo-emoji {
            font-size: 70px;
            margin-bottom: 15px;
            display: block;
            animation: float 4s ease-in-out infinite alternate;
        }
        @keyframes float {
            from { transform: translateY(0px); }
            to { transform: translateY(-12px); }
        }

        .logo-text {
            font-size: 52px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 0 40px #a78bfa, 0 0 80px #7c3aed50;
            animation: logopulse 3s ease-in-out infinite alternate;
        }
        @keyframes logopulse {
            from { text-shadow: 0 0 30px #a78bfa, 0 0 60px #7c3aed40; }
            to { text-shadow: 0 0 60px #c4b5fd, 0 0 100px #7c3aed80; }
        }

        .logo-sub {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-top: 8px;
            letter-spacing: 4px;
            margin-bottom: 50px;
        }

        .choice-cards {
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .choice-card {
            width: 180px;
            padding: 30px 20px;
            border-radius: 24px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            animation: fadeUp 0.8s ease both;
        }
        .choice-card:nth-child(1) {
            background: rgba(124, 58, 237, 0.25);
            animation-delay: 0.1s;
        }
        .choice-card:nth-child(2) {
            background: rgba(16, 185, 129, 0.2);
            animation-delay: 0.2s;
        }
        .choice-card:hover {
            transform: translateY(-8px) scale(1.04);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .choice-icon { font-size: 48px; margin-bottom: 14px; }
        .choice-title { font-size: 18px; font-weight: 700; color: #fff; }
        .choice-sub { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 6px; }
    </style>
</head>
<body>

    <div class="stars" id="stars"></div>

    <!-- كواكب -->
    <div class="planet" style="width:120px;height:120px;background:radial-gradient(circle at 35% 35%,#4f46e5,#1e1b4b);top:-30px;right:-30px;"></div>
    <div class="planet" style="width:80px;height:80px;background:radial-gradient(circle at 35% 35%,#059669,#064e3b);bottom:40px;left:-20px;"></div>

    <div class="container">
        <span class="logo-emoji">🌟</span>
        <div class="logo-text">منارة</div>
        <div class="logo-sub">مساعدك الذكي</div>

        <div class="choice-cards">
            <div class="choice-card" onclick="window.location.href='/static/child_welcome.html'">
                <div class="choice-icon">🧒</div>
                <div class="choice-title">أنا طفل</div>
                <div class="choice-sub">تحدث مع منار</div>
            </div>
            <div class="choice-card" onclick="window.location.href='/static/login.html'">
                <div class="choice-icon">👨‍👩‍👧</div>
                <div class="choice-title">ولي الأمر</div>
                <div class="choice-sub">متابعة الطفل</div>
            </div>
        </div>
    </div>

    <script>
        const stars = document.getElementById('stars');
        for (let i = 0; i < 120; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            const size = Math.random() * 2.5 + 0.5;
            s.style.cssText = `
                width:${size}px;height:${size}px;
                left:${Math.random()*100}%;
                top:${Math.random()*100}%;
                --d:${2+Math.random()*4}s;
                --o:${0.4+Math.random()*0.6};
                animation-delay:${Math.random()*4}s;
            `;
            stars.appendChild(s);
        }
    </script>
</body>
</html>
