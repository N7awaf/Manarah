<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منارة - مراجعة الجلسة الصوتية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: radial-gradient(ellipse at 20% 50%, #0d1b4b 0%, #050a1a 60%, #000 100%);
            color: #fff; min-height: 100vh; padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }
        .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle var(--d, 3s) infinite alternate; opacity: 0.5; }
        @keyframes twinkle { from { opacity: 0.8; } to { opacity: 0.2; } }
        .back-link { color: #a78bfa; text-decoration: none; font-weight: 700; display: block; margin-bottom: 20px; font-size: 14px; }
        .layout { display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
        @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
        .sessions-sidebar {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px; padding: 15px; max-height: 85vh; overflow-y: auto;
        }
        .session-item {
            background: rgba(255,255,255,0.02); border: 1px solid transparent;
            padding: 15px; border-radius: 15px; margin-bottom: 10px; cursor: pointer; transition: 0.3s;
        }
        .session-item:hover, .session-item.active { background: rgba(124,58,237,0.15); border-color: #7c3aed; }
        .session-title { font-weight: 900; font-size: 14px; color: #a78bfa; }
        .session-meta { font-size: 11px; opacity: 0.5; display: block; margin-top: 4px; }
        .master-player {
            background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.3);
            border-radius: 20px; padding: 20px; margin-bottom: 20px; display: none; align-items: center; gap: 15px;
        }
        .play-btn {
            background: #7c3aed; border: none; width: 50px; height: 50px; border-radius: 50%;
            color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .seek-bar-container { flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; position: relative; cursor: pointer; }
        .seek-bar-fill { height: 100%; background: #7c3aed; width: 0%; border-radius: 3px; transition: width 0.1s linear; }
        .chat-container {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px; padding: 25px; backdrop-filter: blur(15px);
        }
        #placeholderMessage {
            display: flex; justify-content: center; align-items: center;
            height: 300px; opacity: 0.4; font-size: 16px;
        }
        .bubble-area { max-height: 350px; overflow-y: auto; padding: 10px; margin: 15px 0; display: none; }
        .bubble-area::-webkit-scrollbar { width: 4px; }
        .bubble-area::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 10px; }
        .bubble { margin-bottom: 15px; padding: 15px; border-radius: 18px; line-height: 1.6; font-size: 14px; position: relative; }
        .child-bubble { background: rgba(167, 139, 250, 0.1); border-right: 4px solid #a78bfa; margin-left: 30px; }
        .ai-bubble { background: rgba(52, 211, 153, 0.1); border-right: 4px solid #34d399; margin-right: 30px; }
        .bubble-label { font-size: 11px; font-weight: 900; margin-bottom: 5px; display: block; opacity: 0.7; }
        .rag-card {
            background: linear-gradient(135deg, rgba(124,58,237,0.15), rgba(0,0,0,0));
            border: 1px solid rgba(167,139,250,0.2); border-radius: 15px; padding: 15px; margin-top: 20px;
        }
        .notes-section { margin-top: 20px; }
        .notes-input {
            width: 100%; height: 100px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px; color: #fff; padding: 15px; font-family: 'Tajawal'; resize: none; font-size: 13px;
        }
        .save-btn {
            background: #34d399; color: #000; border: none; padding: 10px 25px; border-radius: 12px;
            font-weight: 900; cursor: pointer; margin-top: 10px; transition: 0.3s;
        }
        .save-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(52, 211, 153, 0.3); }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="container">
        <a href="/static/parent.html" class="back-link">← العودة للوحة الأب</a>

        <div class="layout">
            <div class="sessions-sidebar" id="sessionsList">
                <div style="text-align:center; opacity:0.3; padding:20px;">جاري جلب السجلات...</div>
            </div>

            <div class="main-content">
                <div class="master-player" id="masterPlayer">
                    <button class="play-btn" id="playBtn">▶</button>
                    <div class="seek-bar-container" id="seekContainer">
                        <div class="seek-bar-fill" id="seekFill"></div>
                    </div>
                    <span id="timeInfo" style="font-size:12px; opacity:0.6;">00:00</span>
                </div>

                <div class="chat-container" id="chatViewer">
                    <div id="placeholderMessage">الرجاء اختيار جلسة من القائمة للمراجعة 📋</div>

                    <div id="sessionContent" style="display: none;">
                        <h2 id="sessionTitle" style="font-size:18px; font-weight:900; color:#a78bfa; margin-bottom: 10px;"></h2>
                        <div class="bubble-area" id="bubbleArea" style="display: block;"></div>

                        <div class="rag-card" id="ragCard" style="display: block;">
                            <div style="font-weight:900; color:#7c3aed; font-size:13px; margin-bottom:8px;">💡 النصيحة العلمية</div>
                            <div id="ragText" style="font-size:13px; color:#c4b5fd; line-height:1.6;"></div>
                        </div>

                        <div class="notes-section" id="notesSection" style="display: block;">
                            <div style="font-weight:900; color:#34d399; font-size:13px; margin-bottom:8px;">📝 ملاحظات ولي الأمر</div>
                            <textarea class="notes-input" id="noteInput" placeholder="اكتب ملاحظاتك لمتابعة حالة الطفل..."></textarea>
                            <button class="save-btn" onclick="saveParentNote()">حفظ التعديلات ✅</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    const starsEl = document.getElementById('stars');

    for (let i = 0; i < 80; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.cssText = `
            width:2px;
            height:2px;
            left:${Math.random()*100}%;
            top:${Math.random()*100}%;
            --d:${2+Math.random()*3}s
        `;
        starsEl.appendChild(s);
    }

    let currentAudioList = [];
    let currentAudioIndex = 0;
    let masterAudio = new Audio();
    let currentSessionId = null;

    let allChildren = [];
    let currentChildId = null;

    async function init() {
        const userId = localStorage.getItem('user_id') || '2';

        try {
            const childrenRes = await fetch(`/get_children?user_id=${userId}`);
            allChildren = await childrenRes.json();

            if (!allChildren || allChildren.length === 0) {
                document.getElementById('sessionsList').innerHTML =
                    '<div style="text-align:center; opacity:0.3; padding:20px;">لا يوجد أطفال مرتبطين بهذا الحساب</div>';
                return;
            }

            const params = new URLSearchParams(window.location.search);
            currentChildId = params.get('child_id') || allChildren[0].id;

            renderChildrenTabs();
            await loadChildSessions(currentChildId);

        } catch(e) {
            document.getElementById('sessionsList').innerHTML =
                '<div style="text-align:center; color:#fca5a5; padding:20px;">فشل الاتصال بالسيرفر</div>';
        }
    }

    function renderChildrenTabs() {
        const list = document.getElementById('sessionsList');

        let tabsHtml = `
            <div style="display:flex;gap:8px;overflow:auto;margin-bottom:15px;padding-bottom:10px;">
        `;

        allChildren.forEach(child => {
            const active = Number(child.id) === Number(currentChildId);

            tabsHtml += `
                <button
                    onclick="switchChild(${child.id})"
                    style="
                        background:${active ? '#7c3aed' : 'rgba(255,255,255,0.05)'};
                        color:#fff;
                        border:none;
                        border-radius:12px;
                        padding:10px 16px;
                        cursor:pointer;
                        font-family:Tajawal;
                        font-weight:700;
                        white-space:nowrap;
                    "
                >
                    👦 ${child.name}
                </button>
            `;
        });

        tabsHtml += `</div>`;

        list.innerHTML = tabsHtml + `
            <div id="sessionsArea">
                <div style="text-align:center; opacity:0.3; padding:20px;">
                    جاري تحميل الجلسات...
                </div>
            </div>
        `;
    }

    async function switchChild(childId) {
        currentChildId = childId;

        window.history.replaceState({}, '', `/static/sessions.html?child_id=${childId}`);

        renderChildrenTabs();
        await loadChildSessions(childId);
    }

    async function loadChildSessions(childId) {
        const area = document.getElementById('sessionsArea');

        try {
            const res = await fetch(`/sessions?child_id=${childId}`);
            const sessions = await res.json();

            if (!sessions || sessions.length === 0) {
                area.innerHTML = `
                    <div style="text-align:center; opacity:0.3; padding:20px;">
                        لا توجد جلسات لهذا الطفل
                    </div>
                `;
                return;
            }

            area.innerHTML = sessions.map((s, index) => {
                const sessionNumber = sessions.length - index;

                return `
                    <div class="session-item"
                        onclick="loadSession(${s.session_id}, this, ${sessionNumber})">

                        <span class="session-title">
                            جلسة #${sessionNumber}
                        </span>

                        <span class="session-meta">
                            ${s.child_name || ''}
                        </span>

                        <span class="session-meta">
                            ${s.start_time || ''}
                        </span>

                    </div>
                `;
            }).join('');

        } catch(e) {
            area.innerHTML = `
                <div style="text-align:center; color:#fca5a5; padding:20px;">
                    فشل تحميل الجلسات
                </div>
            `;
        }
    }

    function splitTranscript(text) {
        if (!text) return [];

        const cleanText = text.trim();

        let childText = "";
        let aiText = "";

        if (cleanText.includes("الطفل:") && cleanText.includes("منار:")) {
            const childStart = cleanText.indexOf("الطفل:") + "الطفل:".length;
            const aiStart = cleanText.indexOf("منار:");

            childText = cleanText.substring(childStart, aiStart).replace("|", "").trim();
            aiText = cleanText.substring(aiStart + "منار:".length).trim();

            return [
                { speaker: "child", text: childText },
                { speaker: "ai", text: aiText }
            ].filter(x => x.text);
        }

        if (cleanText.includes("الطفل:") && cleanText.includes("منارة:")) {
            const childStart = cleanText.indexOf("الطفل:") + "الطفل:".length;
            const aiStart = cleanText.indexOf("منارة:");

            childText = cleanText.substring(childStart, aiStart).replace("|", "").trim();
            aiText = cleanText.substring(aiStart + "منارة:".length).trim();

            return [
                { speaker: "child", text: childText },
                { speaker: "ai", text: aiText }
            ].filter(x => x.text);
        }

        if (cleanText.includes("|")) {
            const parts = cleanText.split("|");

            parts.forEach(part => {
                if (part.includes("الطفل:")) {
                    childText = part.replace("الطفل:", "").trim();
                } else if (part.includes("منار:")) {
                    aiText = part.replace("منار:", "").trim();
                } else if (part.includes("منارة:")) {
                    aiText = part.replace("منارة:", "").trim();
                }
            });

            return [
                { speaker: "child", text: childText },
                { speaker: "ai", text: aiText }
            ].filter(x => x.text);
        }

        return [
            { speaker: "child", text: cleanText }
        ];
    }

    function renderTranscript(script) {
        let bubbles = [];

        script.forEach(m => {
            if (m.speaker && m.text) {
                bubbles.push({
                    speaker: m.speaker,
                    text: m.text
                });
            } else {
                const splitItems = splitTranscript(m.text || "");
                bubbles = bubbles.concat(splitItems);
            }
        });

        if (bubbles.length === 0) {
            return `
                <div style="text-align:center; opacity:0.4; padding:40px;">
                    لا يوجد نص محفوظ لهذه الجلسة
                </div>
            `;
        }

        return bubbles.map(item => {
            const isChild = item.speaker === "child";

            return `
                <div class="bubble ${isChild ? 'child-bubble' : 'ai-bubble'}">
                    <span class="bubble-label">
                        ${isChild ? '🧒 الطفل' : '🤖 منار'}
                    </span>
                    ${item.text}
                </div>
            `;
        }).join('');
    }

    async function loadSession(id, el, sessionNumber) {
        currentSessionId = id;

        masterAudio.pause();
        masterAudio.currentTime = 0;
        currentAudioIndex = 0;

        document.getElementById('playBtn').textContent = "▶";
        document.getElementById('seekFill').style.width = '0%';

        document.querySelectorAll('.session-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');

        document.getElementById('placeholderMessage').style.display = 'none';
        document.getElementById('sessionContent').style.display = 'block';
        document.getElementById('masterPlayer').style.display = 'flex';

        const bubbleArea = document.getElementById('bubbleArea');

        bubbleArea.innerHTML = `
            <div style="text-align:center; opacity:0.3; padding:50px;">
                جاري تحميل تفاصيل الجلسة...
            </div>
        `;

        try {
            const res = await fetch(`/analyze_session/${id}`);
            const data = await res.json();

            document.getElementById('sessionTitle').textContent =
                `مراجعة الجلسة #${sessionNumber}`;

            document.getElementById('ragText').textContent =
                data.advice || '';

            document.getElementById('noteInput').value =
                data.notes || '';

            currentAudioList = data.script
                .filter(m => m.audio_url)
                .map(m => m.audio_url);

            bubbleArea.innerHTML = renderTranscript(data.script || []);

        } catch(err) {
            bubbleArea.innerHTML = `
                <div style="text-align:center; color:#fca5a5; padding:50px;">
                    فشل تحميل بيانات الجلسة
                </div>
            `;
        }
    }

    const playBtn = document.getElementById('playBtn');

    playBtn.onclick = () => {
        if (masterAudio.paused) {
            if (currentAudioList.length > 0) {
                playSequentially();
                playBtn.textContent = "⏸";
            }
        } else {
            masterAudio.pause();
            playBtn.textContent = "▶";
        }
    };

    function playSequentially() {
        if (currentAudioIndex >= currentAudioList.length) {
            currentAudioIndex = 0;
            playBtn.textContent = "▶";
            document.getElementById('seekFill').style.width = '0%';
            return;
        }

        masterAudio.src = currentAudioList[currentAudioIndex];
        masterAudio.play();

        masterAudio.onended = () => {
            currentAudioIndex++;
            playSequentially();
        };
    }

    masterAudio.ontimeupdate = () => {
        if (currentAudioList.length > 0 && masterAudio.duration) {
            const progress =
                ((currentAudioIndex + (masterAudio.currentTime / masterAudio.duration))
                / currentAudioList.length) * 100;

            document.getElementById('seekFill').style.width =
                progress + '%';
        }
    };

    async function saveParentNote() {
        const note = document.getElementById('noteInput').value;

        try {
            const res = await fetch(`/save_note/${currentSessionId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ note })
            });

            if (res.ok) {
                alert("تم حفظ الملاحظة بنجاح ✨");
            } else {
                alert("حدث خطأ أثناء الحفظ");
            }

        } catch(e) {
            alert("تعذر الاتصال بالسيرفر");
        }
    }

    window.onload = init;
</script>
</body>
</html>
